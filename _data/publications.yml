  venue: "Workshop / Conference Name"
  year: 2025
  link: "https://example.com"
  paper: "https://example.com/paper.pdf"
  abstract_zh: "示例论文 2，用于演示多条论文列表的排列效果。"
  abstract_en: "Example paper 2 to demonstrate the list layout."